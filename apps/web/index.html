<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/nexora-icon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/nexora-icon.svg" />
    <link rel="apple-touch-icon" href="/empcloud-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>NEXORA HR — People. Process. Performance.</title>
    <!-- Set the theme class before first paint so there's no flash of the wrong
         theme on load. Mirrors the logic in src/lib/theme.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("empcloud-theme");
          var dark = t === "dark" || ((!t || t === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
